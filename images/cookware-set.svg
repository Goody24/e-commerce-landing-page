<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="cwBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="graniteGrey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="woodHandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#cwBg)" rx="16" />
  
  <!-- Main Large Casserole Pot (Center) -->
  <g transform="translate(130, 110)">
    <!-- Base Pot Body -->
    <path d="M 30 50 Q 30 160 120 160 Q 210 160 210 50 Z" fill="url(#graniteGrey)" stroke="#475569" stroke-width="2" />
    <!-- Granite Speckles -->
    <circle cx="80" cy="80" r="2" fill="#E2E8F0" opacity="0.6" />
    <circle cx="150" cy="90" r="2" fill="#E2E8F0" opacity="0.6" />
    <circle cx="110" cy="120" r="2" fill="#E2E8F0" opacity="0.6" />
    <circle cx="170" cy="130" r="2" fill="#E2E8F0" opacity="0.6" />

    <!-- Side Stay-Cool Wood Grain Handles -->
    <rect x="5" y="55" width="25" height="16" rx="6" fill="url(#woodHandle)" />
    <rect x="210" y="55" width="25" height="16" rx="6" fill="url(#woodHandle)" />

    <!-- Tempered Glass Lid with Steam Vent -->
    <ellipse cx="120" cy="50" rx="90" ry="25" fill="#BAE6FD" fill-opacity="0.4" stroke="#CBD5E1" stroke-width="2" />
    <!-- Lid Knob -->
    <rect x="105" y="20" width="30" height="16" rx="6" fill="url(#woodHandle)" />
  </g>

  <!-- Frying Pan (Right) -->
  <g transform="translate(290, 170)">
    <ellipse cx="60" cy="60" rx="55" ry="20" fill="url(#graniteGrey)" stroke="#475569" stroke-width="2" />
    <!-- Long Handle -->
    <path d="M 115 60 L 190 40 L 190 52 L 115 68 Z" fill="url(#woodHandle)" />
  </g>

  <!-- Small Saucepan (Left) -->
  <g transform="translate(40, 170)">
    <path d="M 20 40 Q 20 100 65 100 Q 110 100 110 40 Z" fill="url(#graniteGrey)" stroke="#475569" stroke-width="2" />
    <!-- Long Handle Left -->
    <path d="M 20 45 L -45 30 L -45 42 L 20 53 Z" fill="url(#woodHandle)" />
  </g>

  <!-- Silicone Spatula & Ladle -->
  <g transform="translate(410, 80) rotate(15)">
    <rect x="0" y="0" width="10" height="130" rx="5" fill="url(#woodHandle)" />
    <path d="M -5 120 L 15 120 L 20 160 L -10 160 Z" fill="#DC2626" rx="4" />
  </g>

  <!-- Badge 12 Pieces -->
  <g transform="translate(40, 40)">
    <circle cx="35" cy="35" r="30" fill="#FF6B00" />
    <text x="35" y="32" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">12 PCS</text>
    <text x="35" y="46" font-family="sans-serif" font-weight="bold" font-size="8" fill="#FFFFFF" text-anchor="middle">GRANITE</text>
  </g>

  <text x="250" y="360" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0B192C" text-anchor="middle">12-PIECE GERMAN GRANITE COOKWARE SET</text>
</svg>
