<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="swBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="touchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="400" fill="url(#swBg)" rx="16" />
  
  <g transform="translate(130, 70)">
    <!-- Plate Shadow -->
    <rect x="8" y="10" width="240" height="240" rx="20" fill="#64748B" opacity="0.3" />
    <!-- Luxury Tempered Glass Plate -->
    <rect x="0" y="0" width="240" height="240" rx="20" fill="url(#glassGrad)" stroke="#CBD5E1" stroke-width="2" />
    <rect x="4" y="4" width="232" height="232" rx="16" fill="none" stroke="#FFFFFF" stroke-width="3" />
    
    <!-- 3 Glowing Capacitive Touch Rings -->
    <!-- Gang 1 (Lit Blue) -->
    <g transform="translate(50, 120)">
      <circle cx="0" cy="0" r="28" fill="#0284C7" opacity="0.15" filter="url(#touchGlow)" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#0284C7" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#0284C7" />
    </g>

    <!-- Gang 2 (Lit Orange) -->
    <g transform="translate(120, 120)">
      <circle cx="0" cy="0" r="28" fill="#FF6B00" opacity="0.2" filter="url(#touchGlow)" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#FF6B00" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#FF6B00" />
    </g>

    <!-- Gang 3 (Lit Blue) -->
    <g transform="translate(190, 120)">
      <circle cx="0" cy="0" r="28" fill="#0284C7" opacity="0.15" filter="url(#touchGlow)" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#0284C7" stroke-width="3" />
      <circle cx="0" cy="0" r="6" fill="#0284C7" />
    </g>

    <!-- Wi-Fi Smart Icon Top Center -->
    <path d="M 110 35 Q 120 25 130 35 M 113 41 Q 120 34 127 41 M 117 47 Q 120 44 123 47" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    <circle cx="120" cy="51" r="1.5" fill="#0284C7" />

    <text x="120" y="210" font-family="sans-serif" font-weight="bold" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="2">SMART WI-FI TOUCH</text>
  </g>
</svg>
