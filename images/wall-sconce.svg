<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="scBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="upBeam" cx="50%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="downBeam" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="500" height="400" fill="url(#scBg)" rx="16" />
  
  <!-- Up Beam -->
  <polygon points="250,110 130,20 370,20" fill="url(#upBeam)" />
  
  <!-- Down Beam -->
  <polygon points="250,290 130,380 370,380" fill="url(#downBeam)" />

  <!-- Sconce Body -->
  <g transform="translate(190, 110)">
    <!-- Shadow -->
    <rect x="5" y="5" width="120" height="180" rx="8" fill="#000000" opacity="0.4" />
    <!-- Matte Black Die-Cast Aluminum Body -->
    <rect x="0" y="0" width="120" height="180" rx="8" fill="#020617" stroke="#334155" stroke-width="2" />
    
    <!-- Top Lens (Illuminated) -->
    <ellipse cx="60" cy="5" rx="40" ry="5" fill="#FEF08A" />
    <!-- Bottom Lens (Illuminated) -->
    <ellipse cx="60" cy="175" rx="40" ry="5" fill="#FEF08A" />

    <!-- Center Accent Line -->
    <line x1="15" y1="90" x2="105" y2="90" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" />
    
    <text x="60" y="105" font-family="sans-serif" font-weight="bold" font-size="8" fill="#94A3B8" text-anchor="middle">IP65 OUTDOOR</text>
  </g>
</svg>
