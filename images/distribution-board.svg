<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="dbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#dbBg)" rx="16" />
  
  <g transform="translate(100, 40)">
    <!-- Outer Metal Enclosure -->
    <rect x="0" y="0" width="300" height="310" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="4" />
    <!-- Smoked Polycarbonate Door (Open / Semi-transparent) -->
    <rect x="15" y="15" width="270" height="280" rx="8" fill="#1E293B" opacity="0.9" />
    
    <!-- Top Busbar & Neutral Block -->
    <rect x="35" y="35" width="230" height="18" rx="4" fill="#D97706" />
    <text x="150" y="48" font-family="sans-serif" font-weight="bold" font-size="9" fill="#FFF" text-anchor="middle">SOLID COPPER NEUTRAL &amp; EARTH BUSBAR</text>

    <!-- Main Isolator (Double Pole 63A) -->
    <g transform="translate(45, 75)">
      <rect x="0" y="0" width="45" height="70" rx="4" fill="#E2E8F0" stroke="#64748B" />
      <rect x="10" y="20" width="25" height="30" rx="3" fill="#DC2626" />
      <text x="22" y="62" font-family="sans-serif" font-weight="bold" font-size="7" fill="#0F172A" text-anchor="middle">MAIN 63A</text>
    </g>

    <!-- RCD Breaker (40A) -->
    <g transform="translate(95, 75)">
      <rect x="0" y="0" width="45" height="70" rx="4" fill="#E2E8F0" stroke="#64748B" />
      <rect x="10" y="20" width="25" height="30" rx="3" fill="#2563EB" />
      <circle cx="22" cy="12" r="3" fill="#F59E0B" />
      <text x="22" y="62" font-family="sans-serif" font-weight="bold" font-size="7" fill="#0F172A" text-anchor="middle">RCD 30mA</text>
    </g>

    <!-- Row of 6 Miniature Circuit Breakers (MCBs) -->
    <g transform="translate(145, 75)">
      <rect x="0" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="4" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="20" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="24" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="40" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="44" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="60" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="64" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="80" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="84" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="100" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="104" y="20" width="10" height="25" rx="2" fill="#0F172A" />
    </g>

    <!-- Lower Row MCBs -->
    <g transform="translate(45, 175)">
      <rect x="0" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="4" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="20" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="24" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="40" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="44" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="60" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="64" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="80" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="84" y="20" width="10" height="25" rx="2" fill="#0F172A" />

      <rect x="100" y="0" width="18" height="70" rx="2" fill="#FFFFFF" stroke="#94A3B8" />
      <rect x="104" y="20" width="10" height="25" rx="2" fill="#0F172A" />
    </g>

    <!-- Bottom Knockouts -->
    <circle cx="60" cy="275" r="10" fill="#334155" stroke="#64748B" />
    <circle cx="105" cy="275" r="10" fill="#334155" stroke="#64748B" />
    <circle cx="150" cy="275" r="10" fill="#334155" stroke="#64748B" />
    <circle cx="195" cy="275" r="10" fill="#334155" stroke="#64748B" />
    <circle cx="240" cy="275" r="10" fill="#334155" stroke="#64748B" />
  </g>
</svg>
