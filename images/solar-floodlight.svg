<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="flBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="lightCone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="500" height="400" fill="url(#flBg)" rx="16" />
  
  <!-- Glowing Light Cone -->
  <circle cx="250" cy="220" r="160" fill="url(#lightCone)" />
  
  <!-- Solar Panel on top -->
  <g transform="translate(160, 40)">
    <polygon points="20,0 160,0 180,70 0,70" fill="#0284C7" stroke="#CBD5E1" stroke-width="2" />
    <line x1="20" y1="35" x2="170" y2="35" stroke="#FFFFFF" stroke-width="1" />
    <line x1="90" y1="0" x2="90" y2="70" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Floodlight Fixture -->
  <g transform="translate(120, 130)">
    <!-- Mounting Bracket -->
    <path d="M 30 110 L -10 160 L 270 160 L 230 110" fill="none" stroke="#64748B" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Lamp Head Frame (Die-Cast Aluminum) -->
    <rect x="0" y="0" width="260" height="150" rx="12" fill="#0B192C" stroke="#475569" stroke-width="3" />
    
    <!-- 4 High-Lumen Optical Lens Clusters -->
    <rect x="15" y="15" width="105" height="55" rx="6" fill="#F8FAFC" stroke="#94A3B8" />
    <circle cx="45" cy="42" r="14" fill="#FEF08A" />
    <circle cx="90" cy="42" r="14" fill="#FEF08A" />

    <rect x="140" y="15" width="105" height="55" rx="6" fill="#F8FAFC" stroke="#94A3B8" />
    <circle cx="170" cy="42" r="14" fill="#FEF08A" />
    <circle cx="215" cy="42" r="14" fill="#FEF08A" />

    <rect x="15" y="80" width="105" height="55" rx="6" fill="#F8FAFC" stroke="#94A3B8" />
    <circle cx="45" cy="107" r="14" fill="#FEF08A" />
    <circle cx="90" cy="107" r="14" fill="#FEF08A" />

    <rect x="140" y="80" width="105" height="55" rx="6" fill="#F8FAFC" stroke="#94A3B8" />
    <circle cx="170" cy="107" r="14" fill="#FEF08A" />
    <circle cx="215" cy="107" r="14" fill="#FEF08A" />

    <!-- Radar PIR Motion Sensor Dome in center -->
    <circle cx="130" cy="75" r="16" fill="#FF6B00" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="130" cy="75" r="8" fill="#FFFFFF" />
  </g>

  <!-- Remote Control (Right Side) -->
  <g transform="translate(390, 160)">
    <rect x="0" y="0" width="55" height="120" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="27" cy="22" r="8" fill="#EF4444" />
    <rect x="10" y="40" width="15" height="12" rx="3" fill="#3B82F6" />
    <rect x="30" y="40" width="15" height="12" rx="3" fill="#3B82F6" />
    <rect x="10" y="60" width="15" height="12" rx="3" fill="#64748B" />
    <rect x="30" y="60" width="15" height="12" rx="3" fill="#64748B" />
    <text x="27" y="95" font-family="sans-serif" font-size="7" fill="#94A3B8" text-anchor="middle">REMOTE</text>
  </g>
  
  <text x="250" y="365" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38BDF8" text-anchor="middle">300W IP67 DUSK-TO-DAWN SECURITY LIGHT</text>
</svg>
