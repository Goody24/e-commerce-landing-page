<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="afBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="bodyBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#afBg)" rx="16" />
  
  <g transform="translate(110, 45)">
    <!-- Shadow -->
    <rect x="10" y="15" width="260" height="290" rx="24" fill="#64748B" opacity="0.3" />
    
    <!-- Main Air Fryer Body (Sleek Matte Black with Rose Gold Accents) -->
    <rect x="0" y="0" width="260" height="290" rx="24" fill="url(#bodyBlack)" stroke="#334155" stroke-width="2" />
    
    <!-- Top Digital Touchscreen Panel -->
    <rect x="25" y="25" width="210" height="85" rx="14" fill="#020617" stroke="#475569" stroke-width="1.5" />
    
    <!-- Touchscreen Readings -->
    <text x="75" y="65" font-family="monospace" font-weight="900" font-size="24" fill="#38BDF8" text-anchor="middle">200<tspan font-size="12">°C</tspan></text>
    <text x="180" y="65" font-family="monospace" font-weight="900" font-size="24" fill="#FF8800" text-anchor="middle">18<tspan font-size="12">MIN</tspan></text>
    
    <!-- Preset Icons Line -->
    <g transform="translate(45, 85)" fill="#94A3B8">
      <circle cx="10" cy="0" r="4" />
      <circle cx="35" cy="0" r="4" fill="#FF6B00" />
      <circle cx="60" cy="0" r="4" />
      <circle cx="85" cy="0" r="4" />
      <circle cx="110" cy="0" r="4" />
      <circle cx="135" cy="0" r="4" />
      <circle cx="160" cy="0" r="4" />
    </g>

    <!-- Dual Basket Front Paneling (Left Basket & Right Basket) -->
    <!-- Basket 1 -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="100" height="135" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <!-- Glass Window -->
      <rect x="15" y="15" width="70" height="60" rx="6" fill="#1E293B" stroke="#64748B" />
      <text x="50" y="50" font-family="sans-serif" font-weight="bold" font-size="10" fill="#F59E0B" text-anchor="middle">ZONE 1</text>
      <!-- Ergonomic Handle -->
      <rect x="35" y="85" width="30" height="40" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="2" />
    </g>

    <!-- Basket 2 -->
    <g transform="translate(135, 130)">
      <rect x="0" y="0" width="100" height="135" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <!-- Glass Window -->
      <rect x="15" y="15" width="70" height="60" rx="6" fill="#1E293B" stroke="#64748B" />
      <text x="50" y="50" font-family="sans-serif" font-weight="bold" font-size="10" fill="#F59E0B" text-anchor="middle">ZONE 2</text>
      <!-- Ergonomic Handle -->
      <rect x="35" y="85" width="30" height="40" rx="6" fill="#1E293B" stroke="#94A3B8" stroke-width="2" />
    </g>
  </g>

  <text x="250" y="370" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0B192C" text-anchor="middle">8.5L XXL DUAL-ZONE DIGITAL AIR FRYER</text>
</svg>
