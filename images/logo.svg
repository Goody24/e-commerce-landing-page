<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110">
  <defs>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>
    <linearGradient id="deepNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3E62" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Solar Sun Rays + Lightning Circuit Bolt -->
  <g transform="translate(15, 10)">
    <!-- Base Shield/Hexagon with Royal Blue -->
    <path d="M 45 5 L 80 25 L 80 65 L 45 85 L 10 65 L 10 25 Z" fill="url(#deepNavy)" stroke="url(#electricBlue)" stroke-width="2.5" />
    
    <!-- Outer Solar Glow Petals/Rays -->
    <circle cx="45" cy="45" r="28" fill="none" stroke="#FF6B00" stroke-width="2" stroke-dasharray="4 6" opacity="0.8" />
    
    <!-- Radiant Sun Core -->
    <circle cx="45" cy="45" r="18" fill="url(#glowOrange)" filter="url(#glowEffect)" />
    
    <!-- Lightning Power Bolt (High contrast White & Blue Glow) -->
    <path d="M 48 24 L 33 46 L 44 46 L 40 66 L 57 42 L 46 42 Z" fill="#FFFFFF" stroke="#0B192C" stroke-width="1.2" />
    
    <!-- Tech Orbit Dot -->
    <circle cx="70" cy="30" r="3.5" fill="#38BDF8" />
    <circle cx="20" cy="60" r="2.5" fill="#FF8800" />
  </g>

  <!-- Typography -->
  <!-- Main Brand Name: ONWAGLOW -->
  <text x="115" y="58" font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="40" letter-spacing="1.5" fill="#0B192C">
    ONWA<tspan fill="url(#glowOrange)">GLOW</tspan>
  </text>

  <!-- Subtitle Tag: ENTERPRISES -->
  <text x="118" y="82" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="700" font-size="13" letter-spacing="5" fill="#1E3E62">
    ENTERPRISES
  </text>

  <!-- Tagline Pill -->
  <rect x="250" y="70" width="180" height="18" rx="9" fill="#F1F5F9" />
  <text x="258" y="83" font-family="sans-serif" font-size="9" font-weight="600" fill="#0284C7" letter-spacing="0.5">
    ⚡ SOLAR • ELECTRICAL • LIVING
  </text>
</svg>
