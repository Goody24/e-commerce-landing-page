<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="batBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="caseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="topCover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#batBg)" rx="16" />
  
  <!-- Battery Unit -->
  <g transform="translate(100, 60)">
    <!-- Shadow -->
    <rect x="8" y="10" width="300" height="260" rx="10" fill="#64748B" opacity="0.3" />
    
    <!-- Main Battery Casing -->
    <rect x="0" y="20" width="300" height="250" rx="10" fill="url(#caseGrad)" stroke="#334155" stroke-width="2" />
    
    <!-- Top Lid Cover (Orange) -->
    <path d="M 0 30 Q 0 10 10 10 L 290 10 Q 300 10 300 30 L 300 50 L 0 50 Z" fill="url(#topCover)" />
    
    <!-- Terminal Posts -->
    <!-- Positive (+) Red -->
    <rect x="40" y="-5" width="22" height="15" rx="3" fill="#DC2626" />
    <circle cx="51" cy="-10" r="10" fill="#EF4444" stroke="#991B1B" stroke-width="2" />
    <text x="51" y="-6" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFF" text-anchor="middle">+</text>

    <!-- Negative (-) Blue/Black -->
    <rect x="238" y="-5" width="22" height="15" rx="3" fill="#2563EB" />
    <circle cx="249" cy="-10" r="10" fill="#3B82F6" stroke="#1E40AF" stroke-width="2" />
    <text x="249" y="-6" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFF" text-anchor="middle">−</text>

    <!-- 6 Vent Plugs (Tubular Float Indicators) -->
    <g transform="translate(85, 0)">
      <circle cx="15" cy="25" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="15" cy="25" r="3" fill="#10B981" />

      <circle cx="38" cy="25" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="38" cy="25" r="3" fill="#10B981" />

      <circle cx="61" cy="25" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="61" cy="25" r="3" fill="#10B981" />

      <circle cx="84" cy="25" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="84" cy="25" r="3" fill="#10B981" />

      <circle cx="107" cy="25" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="107" cy="25" r="3" fill="#10B981" />

      <circle cx="130" cy="25" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="130" cy="25" r="3" fill="#10B981" />
    </g>

    <!-- Heavy-Duty Carry Rope Handles -->
    <path d="M -10 90 Q -25 90 -25 120 Q -25 150 -10 150" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <path d="M 310 90 Q 325 90 325 120 Q 325 150 310 150" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />

    <!-- Front Graphic Plate -->
    <rect x="25" y="75" width="250" height="170" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />
    <text x="150" y="115" font-family="sans-serif" font-weight="900" font-size="22" fill="#FF8800" text-anchor="middle">ONWAGLOW</text>
    <text x="150" y="140" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38BDF8" text-anchor="middle">SOLAR TUBULAR GEL</text>
    
    <rect x="50" y="160" width="200" height="35" rx="6" fill="#0B192C" />
    <text x="150" y="184" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">200Ah / 12V</text>
    
    <text x="150" y="225" font-family="sans-serif" font-weight="500" font-size="10" fill="#94A3B8" text-anchor="middle">⚡ Heavy Duty Deep Cycle • Maintenance Free</text>
  </g>
</svg>
