<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="regBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#regBg)" rx="16" />
  
  <g transform="translate(100, 60)">
    <!-- Gas Hose Coiled (Orange/Black 3-Layer) -->
    <path d="M 120 180 Q 220 220 220 280 Q 220 320 150 320 Q 80 320 80 260 Q 80 200 180 180" fill="none" stroke="#EA580C" stroke-width="18" stroke-linecap="round" />
    
    <!-- Stainless Steel Hose Clamps (2 Units) -->
    <circle cx="130" cy="180" r="14" fill="none" stroke="#94A3B8" stroke-width="5" />
    <circle cx="210" cy="240" r="14" fill="none" stroke="#94A3B8" stroke-width="5" />

    <!-- Gas Regulator Body (Die-Cast Zinc / Blue Coating) -->
    <g transform="translate(60, 40)">
      <!-- Main Dome Body -->
      <circle cx="60" cy="60" r="55" fill="#0284C7" stroke="#0369A1" stroke-width="4" />
      
      <!-- Center Pressure Gauge Dial -->
      <circle cx="60" cy="60" r="32" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
      <!-- Dial Color Zones (Green Safe, Yellow Low, Red High) -->
      <path d="M 40 70 A 24 24 0 0 1 80 70" fill="none" stroke="#22C55E" stroke-width="4" />
      <!-- Dial Needle -->
      <line x1="60" y1="60" x2="60" y2="40" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="60" cy="60" r="4" fill="#0F172A" />

      <!-- Cylinder Connection Fitting (Left) -->
      <rect x="-35" y="48" width="40" height="24" rx="4" fill="#D97706" stroke="#92400E" stroke-width="2" />
      <circle cx="-25" cy="60" r="6" fill="#78350F" />

      <!-- Outlet Nozzle (Right) -->
      <rect x="110" y="50" width="30" height="20" rx="3" fill="#D97706" stroke="#92400E" stroke-width="2" />

      <!-- Top Safety Shutoff Knob -->
      <rect x="45" y="-10" width="30" height="20" rx="4" fill="#DC2626" />
      <text x="60" y="4" font-family="sans-serif" font-weight="bold" font-size="7" fill="#FFF" text-anchor="middle">OFF/ON</text>
    </g>
  </g>

  <text x="250" y="370" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0B192C" text-anchor="middle">GAS REGULATOR WITH PRESSURE GAUGE + 2M HOSE</text>
</svg>
