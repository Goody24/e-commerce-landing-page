<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="chanBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="chandelierGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="500" height="400" fill="url(#chanBg)" rx="16" />
  
  <!-- Warm Ambient Glow Aura -->
  <circle cx="250" cy="220" r="170" fill="url(#chandelierGlow)" />
  
  <!-- Ceiling Canopy / Rose -->
  <rect x="220" y="20" width="60" height="15" rx="4" fill="url(#goldRing)" />
  
  <!-- Suspension Suspension Wires -->
  <line x1="230" y1="35" x2="150" y2="140" stroke="#CBD5E1" stroke-width="1.5" />
  <line x1="250" y1="35" x2="250" y2="100" stroke="#CBD5E1" stroke-width="1.5" />
  <line x1="270" y1="35" x2="350" y2="150" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- 8 Concentric Interlocking Modern Rings in 3D Perspective -->
  <!-- Top Small Ring -->
  <ellipse cx="250" cy="110" rx="60" ry="20" fill="none" stroke="url(#goldRing)" stroke-width="8" />
  <ellipse cx="250" cy="110" rx="60" ry="20" fill="none" stroke="#FFFFFF" stroke-width="2" />

  <!-- Medium Tilted Left Ring -->
  <g transform="rotate(-15, 200, 180)">
    <ellipse cx="200" cy="180" rx="100" ry="32" fill="none" stroke="url(#goldRing)" stroke-width="10" />
    <ellipse cx="200" cy="180" rx="100" ry="32" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- Large Tilted Right Ring -->
  <g transform="rotate(18, 300, 210)">
    <ellipse cx="300" cy="210" rx="130" ry="38" fill="none" stroke="url(#goldRing)" stroke-width="12" />
    <ellipse cx="300" cy="210" rx="130" ry="38" fill="none" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Bottom Grand Center Ring -->
  <ellipse cx="250" cy="280" rx="160" ry="45" fill="none" stroke="url(#goldRing)" stroke-width="14" />
  <ellipse cx="250" cy="280" rx="160" ry="45" fill="none" stroke="#FFFFFF" stroke-width="3.5" />

  <!-- Crystal Droplets / Light Sparkles -->
  <g fill="#FFFFFF">
    <circle cx="160" cy="120" r="3" />
    <circle cx="340" cy="130" r="3" />
    <circle cx="120" cy="240" r="4" />
    <circle cx="380" cy="260" r="4" />
    <circle cx="250" cy="325" r="3" />
  </g>

  <text x="250" y="375" font-family="sans-serif" font-weight="900" font-size="13" fill="#FDE68A" text-anchor="middle" letter-spacing="3">8-RING LUXURY LED CHANDELIER</text>
</svg>
