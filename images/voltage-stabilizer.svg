<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="stabBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="stabChassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#stabBg)" rx="16" />
  
  <g transform="translate(100, 50)">
    <!-- Chassis Shadow -->
    <rect x="10" y="10" width="300" height="280" rx="14" fill="#64748B" opacity="0.3" />
    <!-- Metal Chassis -->
    <rect x="0" y="0" width="300" height="280" rx="14" fill="url(#stabChassis)" stroke="#334155" stroke-width="3" />
    
    <!-- Top Carry Handle -->
    <path d="M 90 0 L 90 -20 Q 90 -30 100 -30 L 200 -30 Q 210 -30 210 -20 L 210 0" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round" />

    <!-- Dual Digital LED Voltmeters -->
    <!-- Input Voltage (Red LED) -->
    <g transform="translate(35, 40)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#020617" stroke="#DC2626" stroke-width="1.5" />
      <text x="50" y="42" font-family="monospace" font-weight="900" font-size="28" fill="#EF4444" text-anchor="middle">145<tspan font-size="14">V</tspan></text>
      <text x="50" y="75" font-family="sans-serif" font-weight="bold" font-size="10" fill="#94A3B8" text-anchor="middle">INPUT VOLTS</text>
    </g>

    <!-- Output Voltage (Green LED) -->
    <g transform="translate(165, 40)">
      <rect x="0" y="0" width="100" height="60" rx="6" fill="#020617" stroke="#16A34A" stroke-width="1.5" />
      <text x="50" y="42" font-family="monospace" font-weight="900" font-size="28" fill="#22C55E" text-anchor="middle">220<tspan font-size="14">V</tspan></text>
      <text x="50" y="75" font-family="sans-serif" font-weight="bold" font-size="10" fill="#94A3B8" text-anchor="middle">OUTPUT STABILIZED</text>
    </g>

    <!-- Status LEDs -->
    <g transform="translate(50, 130)">
      <circle cx="20" cy="0" r="6" fill="#22C55E" />
      <text x="35" y="4" font-family="sans-serif" font-size="9" fill="#94A3B8">WORKING</text>

      <circle cx="100" cy="0" r="6" fill="#F59E0B" />
      <text x="115" y="4" font-family="sans-serif" font-size="9" fill="#94A3B8">DELAY</text>

      <circle cx="170" cy="0" r="6" fill="#EF4444" />
      <text x="185" y="4" font-family="sans-serif" font-size="9" fill="#94A3B8">UNUSUAL</text>
    </g>

    <!-- Power Rocker Switch -->
    <rect x="50" y="160" width="50" height="30" rx="4" fill="#DC2626" />
    <line x1="75" y1="165" x2="75" y2="185" stroke="#FFFFFF" stroke-width="3" />

    <!-- 5000VA Badge -->
    <rect x="130" y="155" width="135" height="40" rx="6" fill="#FF6B00" />
    <text x="197" y="180" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">5000VA / 5kVA</text>

    <!-- Bottom Air Intake Vents -->
    <g transform="translate(40, 215)">
      <rect x="0" y="0" width="220" height="4" rx="2" fill="#334155" />
      <rect x="0" y="12" width="220" height="4" rx="2" fill="#334155" />
      <rect x="0" y="24" width="220" height="4" rx="2" fill="#334155" />
      <rect x="0" y="36" width="220" height="4" rx="2" fill="#334155" />
    </g>
  </g>
</svg>
