<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="dkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="walnutWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#270D03" />
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#dkBg)" rx="16" />
  
  <g transform="translate(60, 80)">
    <!-- Base Shadow -->
    <polygon points="40,240 370,240 340,265 10,265" fill="#64748B" opacity="0.3" />

    <!-- Main Desktop Top Surface (Perspective) -->
    <polygon points="50,40 340,40 300,100 10,100" fill="url(#walnutWood)" stroke="#92400E" stroke-width="2" />
    <!-- Front Bevel Edge -->
    <polygon points="10,100 300,100 300,115 10,115" fill="#270D03" />

    <!-- Privacy Modesty Panel in Front -->
    <rect x="50" y="115" width="180" height="90" fill="#0B192C" />
    <line x1="60" y1="160" x2="220" y2="160" stroke="#FF6B00" stroke-width="2" />

    <!-- Left Steel Leg Frame -->
    <path d="M 25 115 L 25 240 M 20 240 L 45 240" stroke="#1E293B" stroke-width="12" stroke-linecap="square" />

    <!-- Right Side Return Cabinet with 3 Drawers -->
    <g transform="translate(230, 90)">
      <polygon points="0,25 90,0 90,150 0,150" fill="#0F172A" stroke="#334155" />
      
      <!-- Drawer 1 -->
      <rect x="5" y="30" width="80" height="35" rx="3" fill="#1E293B" stroke="#475569" />
      <rect x="35" y="45" width="20" height="4" rx="2" fill="#FF8800" /> <!-- Aluminum Handle -->

      <!-- Drawer 2 -->
      <rect x="5" y="70" width="80" height="35" rx="3" fill="#1E293B" stroke="#475569" />
      <rect x="35" y="85" width="20" height="4" rx="2" fill="#FF8800" />

      <!-- Drawer 3 -->
      <rect x="5" y="110" width="80" height="35" rx="3" fill="#1E293B" stroke="#475569" />
      <rect x="35" y="125" width="20" height="4" rx="2" fill="#FF8800" />
    </g>

    <!-- Executive Laptop & Desk Pad on Top -->
    <rect x="90" y="55" width="90" height="35" rx="2" fill="#0F172A" />
    <polygon points="110,60 160,60 155,75 115,75" fill="#CBD5E1" />
  </g>

  <text x="250" y="370" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0B192C" text-anchor="middle">EXECUTIVE 1.6M L-SHAPED MANAGERIAL WORKSTATION</text>
</svg>
